name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Install studio deps
        run: npm ci --prefix studio
      - name: Typecheck (root)
        run: npm run typecheck
      - name: Typecheck (studio)
        run: npm run typecheck --prefix studio
      - name: Unit tests (root)
        run: npm run test
      - name: Unit tests (studio)
        run: npm run test --prefix studio
      - name: Astro build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
